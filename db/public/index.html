<!DOCTYPE html>
<html>
<head>
	<title>Database Tester</title>
</head>
<body>
	<h1>GET/POST Tester</h1>

	<div id="getForm">
		<h2>GET Request</h2>
		<label for="dbName">Database Name:</label>
		<input type="text" id="dbName" name="dbName" required><br><br>
		<label for="path">Path:</label>
		<input type="text" id="path" name="path" required><br><br>
		<button type="submit" onClick="sendGetRequest()">Submit GET Request</button><br>
    <div>
      <p id="getResponse"></p>
    </div>
	</div>

	<div id="postForm">
		<h2>POST Request</h2>
		<label for="dbNamePost">Database Name:</label>
		<input type="text" id="dbNamePost" name="dbName" required><br><br>
		<label for="pathPost">Path:</label>
		<input type="text" id="pathPost" name="path" required><br><br>
		<label for="data">Data (JSON format):</label><br>
		<textarea id="data" name="data" rows="4" cols="50" required></textarea><br><br>
		<button type="submit" onClick="sendPostRequest()">Submit POST Request</button>
	</div>

	<script src="script.js"></script>
</body>
</html>
